spring:
  application:
    name: SmartHome
  datasource:
    url: jdbc:h2:file:./data/smarthome;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.preferred_enum_jdbc_type: VARCHAR
  kafka:
    bootstrap-servers: ${SMARTHOME_KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000

smarthome:
  assistant:
    api-key: ${SMARTHOME_ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:}}
